<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RARE.Qc | Repertoried Clinical Research Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- SheetJS (xlsx) — same library and CDN as the other RARE.Qc surveys.
     Used only to build the .xlsx file attached to the submission email. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =====================================================================
   RARE.Qc REPERTORIED CLINICAL RESEARCH SURVEY — STYLE SHEET
   Same design tokens as the non-repertoried and resource surveys.
   ===================================================================== */
:root{
  /* Orange palette: sets this survey apart from the teal RARE.Qc surveys. */
  --paper:#FBF8F5; --surface:#FFFFFF; --surface-sunk:#F7F0E9;
  --ink:#2B211B; --ink-soft:#66574D; --ink-faint:#9C8E84;
  --line:#E8DCD1; --line-soft:#F2EAE2;
  --brand-900:#4A2309; --brand-700:#A3460F; --brand-600:#B9531A; --brand-500:#E07B30; --brand-100:#FCE9D8;
  --amber-600:#8A5A12; --amber-100:#F6EADA; --amber-50:#FFFBF0;
  --clay-600:#B4553B; --clay-100:#F3E2DB;
  --ok:#2E7D4F; --ok-bg:#E6F2EA; --warn:#B3261E; --warn-bg:#FBEAE8;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --font-display:"Fraunces", Georgia, serif;
  --font-body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shadow-1:0 1px 2px rgba(74,35,9,0.06), 0 1px 1px rgba(74,35,9,0.04);
  --shadow-2:0 6px 20px rgba(74,35,9,0.12);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3{ margin:0; font-family:var(--font-display); font-weight:600; color:var(--brand-900); }
p{ margin:0 0 .6em; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; font-size:13.5px; }
a{ color:var(--brand-600); }
:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; }

/* ---------- top bar: logo, autosave status, language switch ---------- */
.topbar{ position:sticky; top:0; z-index:60; background:var(--brand-900); color:#FDF1E7; padding:10px 20px; display:flex; align-items:center; gap:14px; }
.topbar .logo-img{ height:34px; width:auto; display:block; }
.topbar .bar-title{ font-family:var(--font-display); font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:14px; border-left:1px solid rgba(255,255,255,.25); }
.topbar .spacer{ flex:1; }
.topbar .save-state{ font-size:12.5px; color:#F7D5B8; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.topbar .save-dot{ width:7px; height:7px; border-radius:50%; background:#6FCB9E; box-shadow:0 0 0 3px rgba(111,203,158,.2); flex:none; }
.lang-toggle{ display:flex; border:1px solid rgba(255,255,255,.35); border-radius:var(--radius-sm); overflow:hidden; font-size:13px; flex:none; }
.lang-toggle button{ background:transparent; color:#F7D5B8; border:none; padding:7px 12px; font-weight:500; }
.lang-toggle button.active{ background:rgba(255,255,255,.18); color:#fff; font-weight:700; }
@media (max-width:900px){ .topbar .bar-title{ display:none; } }
@media (max-width:520px){ .topbar{ padding:10px 16px; gap:10px; } .topbar .logo-img{ height:28px; } .topbar .save-state span:last-child{ display:none; } }

/* ---------- page ---------- */
.shell{ width:100%; max-width:1400px; margin:0 auto; padding:26px 20px 80px; }
@media (max-width:520px){ .shell{ padding:20px 16px 60px; } }
.hero{ text-align:center; margin-bottom:22px; }
.hero .logo{ height:72px; width:auto; display:block; margin:0 auto 14px; }
.hero h1{ font-size:28px; line-height:1.2; margin-bottom:10px; }
.hero p{ color:var(--ink-soft); font-size:14.5px; max-width:760px; margin:0 auto 8px; }
.hero p a{ color:var(--brand-600); font-weight:600; }
.hero .save-line{ display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--brand-700); background:var(--brand-100); border-radius:999px; padding:5px 14px; margin-top:8px; }
.hero .save-line .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }
@media (max-width:640px){ .hero .logo{ height:54px; } .hero h1{ font-size:23px; } }

.grid th .th-note{ display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft); line-height:1.4; margin-top:4px; }

/* Submitter block (below the table) — internal only */
.contact-block{ margin-top:18px; background:var(--amber-50); border:1px solid #E9D9A8; border-radius:var(--radius-md); padding:16px 20px; }
.contact-block .cb-head{ font-size:14px; font-weight:600; color:var(--ink); margin-bottom:10px; }
.contact-block .internal-tag{ display:inline-block; margin:0 0 0 8px; vertical-align:1px; }
.contact-block .fields{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
@media (max-width:640px){ .contact-block .fields{ grid-template-columns:1fr; } }
.contact-block label{ display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:5px; }
.contact-block label .req{ color:var(--clay-600); margin-left:2px; }
.contact-block input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); min-height:42px; font-size:14px; }
.contact-block input:focus{ border-color:var(--brand-500); outline:none; box-shadow:0 0 0 3px var(--brand-100); }
.contact-block .field.invalid input{ border-color:var(--warn); background:var(--warn-bg); }
.contact-block .field .cell-error{ padding:3px 2px 0; }
.contact-block .field.invalid .cell-error{ display:block; }
.contact-block .help{ font-size:12.5px; color:var(--ink-soft); margin-top:10px; }

.table-hint{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft); margin:0 2px 8px; }
.table-hint .count{ font-weight:600; color:var(--brand-700); }
.table-hint .scroll-hint{ margin-left:auto; color:var(--ink-faint); font-size:12.5px; }
@media (min-width:1100px){ .table-hint .scroll-hint{ display:none; } }

/* ---------- the spreadsheet-style table ---------- */
.table-wrap{
  background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--brand-500);
  border-radius:var(--radius-md); box-shadow:var(--shadow-1);
  overflow:auto; max-height:calc(100vh - 150px); min-height:200px;
}
table.grid{ border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
.grid th, .grid td{ border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); vertical-align:top; }
.grid thead th{
  position:sticky; top:0; z-index:3; background:var(--surface-sunk); text-align:left;
  font-size:12.5px; font-weight:600; color:var(--ink); padding:9px 10px; line-height:1.3; border-bottom:1px solid var(--line);
}
.grid thead tr.r2 th{ top:var(--head1-h, 36px); font-weight:500; color:var(--ink-soft); }
.grid thead th.group{ text-align:center; background:var(--brand-100); }
.grid thead th.group .th-note{ color:var(--brand-700); }
.grid th .req{ color:var(--clay-600); margin-left:2px; }
.internal-tag{ display:block; width:max-content; font-size:10.5px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; color:var(--amber-600); margin-top:3px; }

.grid .c-n{ width:42px; min-width:42px; text-align:center; color:var(--ink-faint); font-size:12px; padding-top:13px; background:var(--surface-sunk); }
@media (min-width:760px){
  .grid .c-n{ position:sticky; left:0; z-index:2; }
  .grid .c-name{ position:sticky; left:42px; z-index:2; background:var(--surface); box-shadow:2px 0 0 var(--line); }
  .grid thead .c-n, .grid thead .c-name{ z-index:5; background:var(--surface-sunk); }
}
.grid td{ padding:4px; background:var(--surface); }
.grid td.c-n{ background:var(--surface-sunk); }
.grid tbody tr:hover td:not(.c-n){ background:#FFFCF9; }

.grid input[type=text], .grid input[type=url], .grid textarea{
  width:100%; border:1px solid transparent; background:transparent; padding:7px 8px; border-radius:var(--radius-sm); color:var(--ink); min-height:36px;
}
.grid textarea{ resize:none; overflow:hidden; line-height:1.4; display:block; }
.grid input:hover, .grid textarea:hover{ border-color:var(--line); }
.grid input:focus, .grid textarea:focus{ border-color:var(--brand-500); background:var(--surface); outline:none; box-shadow:0 0 0 3px var(--brand-100); }
::placeholder{ font-style:italic; color:var(--ink-faint); opacity:1; }

.grid td.invalid input, .grid td.invalid textarea{ border-color:var(--warn) !important; background:var(--warn-bg) !important; }
.cell-error{ display:none; font-size:11.5px; color:var(--warn); padding:2px 8px 0; }
.grid td.invalid .cell-error{ display:block; }

/* sites inside a cell */
.site-row{ display:flex; align-items:center; gap:2px; }
.site-row + .site-row{ margin-top:2px; }
.site-row input{ flex:1; }
.mini-remove{ background:none; border:none; color:var(--ink-faint); font-size:13px; width:26px; height:30px; border-radius:var(--radius-sm); flex:none; }
.mini-remove:hover{ color:var(--warn); background:var(--warn-bg); }
.mini-add{ background:none; border:none; color:var(--brand-600); font-size:12px; font-weight:600; padding:4px 8px; }
.mini-add:hover{ text-decoration:underline; }

.row-remove-btn{ background:none; border:1px solid var(--line); color:var(--warn); border-radius:var(--radius-sm); width:32px; height:32px; margin:2px auto 0; display:block; font-size:13px; }
.row-remove-btn:hover{ background:var(--warn-bg); }
.add-row-btn{
  display:block; width:100%; border:none; border-top:1px dashed var(--line); background:var(--brand-100); color:var(--brand-700);
  padding:11px; font-weight:600; font-size:13.5px; position:sticky; left:0;
}
.add-row-btn:hover{ background:#F9DCC2; }

/* ---------- buttons / actions ---------- */
.btn{ padding:11px 20px; border-radius:var(--radius-sm); font-size:14px; font-weight:600; border:1px solid transparent; }
.btn-primary{ background:var(--brand-700); color:#fff; }
.btn-primary:hover{ background:var(--brand-900); }
.btn-secondary{ background:var(--surface); color:var(--brand-700); border-color:var(--brand-500); }
.btn-secondary:hover{ background:var(--brand-100); }
.btn-text{ background:none; color:var(--ink-soft); border:none; text-decoration:underline; padding:11px 6px; font-size:13.5px; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px; }
.actions .note-save{ flex:1; font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:7px; min-width:220px; }
.actions .note-save .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
@media (max-width:640px){ .actions .btn-primary{ width:100%; } }

.error-list{ margin-top:12px; background:var(--warn-bg); border:1px solid #F0C4BE; color:#7E1F18; border-radius:var(--radius-md); padding:10px 14px; font-size:13px; }
.error-list ul{ margin:4px 0 0; padding-left:18px; }

/* ---------- confirm panel ---------- */
.review{ margin-top:18px; border:1px solid var(--brand-500); background:var(--surface); border-radius:var(--radius-lg); padding:20px 24px; box-shadow:var(--shadow-2); max-width:760px; margin-left:auto; }
.review h2{ font-size:20px; margin-bottom:4px; }
.review .muted{ color:var(--ink-soft); font-size:13px; margin-bottom:10px; }
.review ol{ margin:0 0 6px; padding-left:22px; font-size:13.5px; }
.review ol li{ padding:3px 0; }
.review ol li .meta{ color:var(--ink-faint); }
.review .actions{ justify-content:flex-end; }

/* ---------- confirmation / toast ---------- */
.done{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); text-align:center; padding:34px 24px; max-width:760px; margin:0 auto; }
.done .tick{ width:52px; height:52px; border-radius:50%; background:var(--ok-bg); color:var(--ok); font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.done h2{ font-size:22px; margin-bottom:8px; }
.done p{ color:var(--ink-soft); }
.toast{ position:fixed; bottom:20px; right:20px; background:var(--brand-900); color:#fff; padding:11px 16px; border-radius:var(--radius-sm); font-size:13px; box-shadow:var(--shadow-2); z-index:200; opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none; max-width:380px; }
.toast.show{ opacity:1; transform:translateY(0); }
@media (max-width:640px){ .toast{ left:16px; right:16px; max-width:none; } }
.hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   RARE.Qc REPERTORIED CLINICAL RESEARCH SURVEY — APPLICATION
   For studies that ARE registered on ClinicalTrials.gov and/or
   Recherche Santé Québec (RSQ) but are missing from the RARE.Qc
   Clinical Research Directory.
     PART A  — CONFIGURATION
     PART A2 — TRANSLATIONS (display only; data is stored in English)
     PART B  — STATE & PERSISTENCE (localStorage autosave)
     PART C  — VALIDATION
     PART D  — RENDER (rebuilt from STATE: switching language keeps data)
     PART E  — SUBMIT (1. Google Sheet, then 2. email with .xlsx)
     PART F  — BOOTSTRAP

/* ================== PART B — STATE & PERSISTENCE ==================== */
const STORAGE_KEY = "rareqc_repertoried_survey_v1";   // separate from the other surveys' keys
const AUTOSAVE_MS = 1500;

function rowId(){ return "s_" + Math.random().toString(36).slice(2,10); }
function blankStudy(){ return { id: rowId(), title:"", ctgov:"", rsq:"", sites:[""] }; }
function freshState(lang){
  return { studies:[blankStudy()], contact:{ name:"", email:"" }, ui:{ lang: lang || "en", reviewing:false, done:false, doneCount:0 } };
}
let STATE = freshState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    STATE.ui = Object.assign(freshState().ui, saved.ui || {});
    STATE.contact = Object.assign({ name:"", email:"" }, saved.contact || {});
    const rows = Array.isArray(saved.studies) ? saved.studies : [];
    STATE.studies = rows.map(r=>{
      const s = Object.assign(blankStudy(), r);
      // Earlier version of this form had "institution" and "website" columns.
      if((!Array.isArray(s.sites) || !s.sites.some(v => v && v.trim())) && r.institution) s.sites = [r.institution];
      if(!Array.isArray(s.sites) || !s.sites.length) s.sites = [""];
      delete s.institution; delete s.website;
      return s;
    });
    if(!STATE.studies.length) STATE.studies = [blankStudy()];
    return STATE.studies.some(s => !isEmptyStudy(s)) || !!(STATE.contact.name.trim() || STATE.contact.email.trim());
  }catch(e){ console.warn("State load failed.", e); return false; }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ console.warn("State save failed.", e); return; }
  const label = document.getElementById("saveLabel");
  if(label) label.textContent = t("savedAt") + " " + new Date().toLocaleTimeString(isFr() ? "fr-CA" : "en-CA", {hour:"2-digit", minute:"2-digit"});
}
let autosaveTimer = null;
function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(saveState, AUTOSAVE_MS); }

function isEmptyStudy(s){
  return !(s.title.trim() || s.ctgov.trim() || s.rsq.trim() || s.sites.some(v => v && v.trim()));
}
function filledStudies(){ return STATE.studies.filter(s => !isEmptyStudy(s)); }

function clearAll(){
  if(!window.confirm(t("clearConfirm"))) return;
  STATE = freshState(STATE.ui.lang);
  saveState();
  renderApp();
  toast(t("clearDone"));
}

/* ================== PART C — VALIDATION ============================= */
function normalizeUrl(v){
  v = (v || "").trim();
  if(v && !/^[a-z][a-z0-9+.-]*:\/\//i.test(v) && /^[^\s]+\.[^\s]+$/.test(v)) v = "https://" + v;   // "www.x.ca" -> "https://www.x.ca"
  return v;
}
// ClinicalTrials.gov: also accept a bare NCT number and turn it into a link.
function normalizeCtgov(v){
  v = (v || "").trim();
  if(NCT_REGEX.test(v)) return "https://clinicaltrials.gov/study/" + v.toUpperCase();
  return normalizeUrl(v);
}
function isCtgovUrl(v){
  try{ return /(^|\.)clinicaltrials\.gov$/i.test(new URL(v).hostname); }catch(e){ return false; }
}
// Errors for one study: { columnKey: stringKey }. Empty rows are never invalid.
function studyErrors(s){
  const e = {};
  if(isEmptyStudy(s)) return e;
  if(!s.title.trim()) e.title = "fieldRequired";
  const ct = s.ctgov.trim(), rsq = s.rsq.trim();
  if(!ct && !rsq){ e.ctgov = "registryRequired"; e.rsq = "registryRequired"; }
  if(ct){
    if(!URL_REGEX.test(ct) && !NCT_REGEX.test(ct)) e.ctgov = "invalidUrl";
    else if(URL_REGEX.test(ct) && !isCtgovUrl(ct)) e.ctgov = "notCtgov";
  }
  if(rsq && !URL_REGEX.test(rsq)) e.rsq = "invalidUrl";
  return e;
}
function contactErrors(){
  const e = {};
  if(!STATE.contact.name.trim()) e.name = "fieldRequired";
  const em = STATE.contact.email.trim();
  if(!em) e.email = "fieldRequired";
  else if(!EMAIL_REGEX.test(em)) e.email = "invalidEmail";
  return e;
}
function allErrors(){
  const out = [];
  STATE.studies.forEach((s, i)=>{ const e = studyErrors(s); if(Object.keys(e).length) out.push({ index:i, id:s.id, errors:e }); });
  return out;
}
function hasAnyError(){ return allErrors().length > 0 || Object.keys(contactErrors()).length > 0; }

function paintCell(td, errKey){
  td.classList.toggle("invalid", !!errKey);
  const msg = td.querySelector(":scope > .cell-error");
  if(msg) msg.textContent = errKey ? t(errKey) : "";
}
function paintErrors(onlyClear){
  STATE.studies.forEach(s=>{
    const e = studyErrors(s);
    document.querySelectorAll('tr[data-row="'+s.id+'"] td[data-col]').forEach(td=>{
      if(onlyClear && !td.classList.contains("invalid")) return;
      paintCell(td, e[td.getAttribute("data-col")]);
    });
  });
  const ce = contactErrors();
  document.querySelectorAll(".contact-block .field[data-field]").forEach(f=>{
    if(onlyClear && !f.classList.contains("invalid")) return;
    paintCell(f, ce[f.getAttribute("data-field")]);
  });
}

/* ================== PART D — RENDER ================================= */
function t(key){
  const dict = UI_STRINGS[STATE.ui.lang] || UI_STRINGS.en;
  return dict[key] !== undefined ? dict[key] : (UI_STRINGS.en[key] !== undefined ? UI_STRINGS.en[key] : key);
}
function isFr(){ return STATE.ui.lang === "fr"; }
function countLabel(n){ return n === 1 ? t("studyCount1") : t("studyCountN").replace("{n}", n); }

function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(k=>{
    const v = attrs[k];
    if(v === undefined || v === null || v === false) return;
    if(k === "class") node.className = v;
    else if(k === "html") node.innerHTML = v;
    else if(k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  });
  (children || []).forEach(c=>{ if(c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
}
function toast(msg){
  const tEl = document.getElementById("toast");
  tEl.textContent = msg; tEl.classList.add("show");
  clearTimeout(tEl._timer); tEl._timer = setTimeout(()=> tEl.classList.remove("show"), 3600);
}
function autoGrow(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function onEdit(){
  scheduleAutosave();
  paintErrors(true);
  updateCount();
  refreshReview();
  if(STATE.ui.reviewing) renderErrorList();
}

/* ---- column definitions (order = table order) ---- */
const COLUMNS = [
  { key:"title",       label:"colTitle",       w:320, required:true },
  { key:"ctgov",       label:"colCtgov",       w:250, note:"noteCtgov", group:true },
  { key:"rsq",         label:"colRsq",         w:250, group:true },
  { key:"sites",       label:"colSites",       w:290, note:"noteSites" }
];

function headerCell(col, rowspan){
  const th = el("th",{rowspan: rowspan > 1 ? String(rowspan) : null,
    class: col.key === "title" ? "c-name" : null,
    style:"min-width:"+col.w+"px;width:"+col.w+"px;"});
  th.appendChild(document.createTextNode(t(col.label)));
  if(col.required) th.appendChild(el("span",{class:"req", "aria-hidden":"true"},["*"]));
  if(col.note) th.appendChild(el("span",{class:"th-note"},[t(col.note)]));
  return th;
}
function renderHead(){
  const thead = el("thead",{});
  const r1 = el("tr",{class:"r1"}), r2 = el("tr",{class:"r2"});
  r1.appendChild(el("th",{rowspan:"2", class:"c-n"},["#"]));
  let groupDone = false;
  COLUMNS.forEach(col=>{
    if(col.group){
      if(!groupDone){
        const g = el("th",{colspan:"2", class:"group"},[t("colRegistry")]);
        g.appendChild(el("span",{class:"req", "aria-hidden":"true"},["*"]));
        g.appendChild(el("span",{class:"th-note"},[t("noteRegistry")]));
        r1.appendChild(g); groupDone = true;
      }
      r2.appendChild(headerCell(col, 1));
    } else {
      r1.appendChild(headerCell(col, 2));
    }
  });
  r1.appendChild(el("th",{rowspan:"2", style:"min-width:48px;width:48px;"},[""]));
  thead.appendChild(r1); thead.appendChild(r2);
  return thead;
}

function cell(colKey, extraClass){ return el("td",{"data-col":colKey, class:extraClass || null}); }
function errSlot(){ return el("div",{class:"cell-error", "aria-live":"polite"}); }

function textareaCell(s, key, placeholder, ariaLabel){
  const td = cell(key, key === "title" ? "c-name" : null);
  const ta = el("textarea",{rows:"1", placeholder:placeholder || "", "aria-label":ariaLabel});
  ta.value = s[key] || "";
  ta.addEventListener("input", e=>{ s[key] = e.target.value; autoGrow(ta); onEdit(); });
  td.appendChild(ta); td.appendChild(errSlot());
  return td;
}
function urlCell(s, key, placeholder, ariaLabel, normalizer){
  const td = cell(key);
  const input = el("input",{type:"text", inputmode:"url", placeholder:placeholder || "https://", "aria-label":ariaLabel, autocomplete:"off", spellcheck:"false"});
  input.value = s[key];
  input.addEventListener("input", e=>{ s[key] = e.target.value; onEdit(); });
  input.addEventListener("blur", e=>{
    const n = normalizer(e.target.value);
    if(n !== e.target.value){ e.target.value = n; s[key] = n; onEdit(); }
    // Show format problems as soon as the user leaves the cell (not "required" ones).
    const err = studyErrors(s)[key];
    if(err && err !== "registryRequired") paintCell(td, err);
  });
  td.appendChild(input); td.appendChild(errSlot());
  return td;
}

function renderRow(s, index){
  const tr = el("tr",{"data-row":s.id});
  tr.appendChild(el("td",{class:"c-n"},[String(index+1)]));
  tr.appendChild(textareaCell(s, "title", t("titlePh"), t("colTitle")));
  tr.appendChild(urlCell(s, "ctgov", t("ctgovPh"), t("colCtgov"), normalizeCtgov));
  tr.appendChild(urlCell(s, "rsq", "https://", t("colRsq"), normalizeUrl));
  tr.appendChild(sitesCell(s));
  const tdDel = el("td",{});
  tdDel.appendChild(el("button",{type:"button", class:"row-remove-btn", title:t("removeStudy"), "aria-label":t("removeStudy") + " " + (index+1),
    onclick:()=> removeStudy(s)},["✕"]));
  tr.appendChild(tdDel);
  return tr;
}
function sitesCell(s){
  const td = cell("sites");
  s.sites.forEach((val, i)=>{
    const row = el("div",{class:"site-row"});
    const input = el("input",{type:"text", placeholder:t("sitePh"), "aria-label":t("colSites") + " " + (i+1), autocomplete:"off", "data-site":String(i)});
    input.value = val;
    input.addEventListener("input", e=>{ s.sites[i] = e.target.value; onEdit(); });
    input.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); addSite(s); } });
    row.appendChild(input);
    if(s.sites.length > 1){
      row.appendChild(el("button",{type:"button", class:"mini-remove", title:t("removeSite"), "aria-label":t("removeSite"),
        onclick:()=>{ s.sites.splice(i,1); saveState(); rerenderRow(s); }},["✕"]));
    }
    td.appendChild(row);
  });
  td.appendChild(el("button",{type:"button", class:"mini-add", onclick:()=> addSite(s)},[t("addSite")]));
  return td;
}
function addSite(s){
  s.sites.push(""); saveState(); rerenderRow(s);
  const inputs = document.querySelectorAll('tr[data-row="'+s.id+'"] input[data-site]');
  if(inputs.length) inputs[inputs.length-1].focus();
}
function rerenderRow(s){
  const old = document.querySelector('tr[data-row="'+s.id+'"]');
  if(old){ const fresh = renderRow(s, STATE.studies.indexOf(s)); old.replaceWith(fresh); growAll(fresh); }
  if(STATE.ui.reviewing) paintErrors(false);
  updateCount(); refreshReview();
}
function growAll(root){ (root || document).querySelectorAll(".grid textarea").forEach(autoGrow); }

function addStudy(){
  const s = blankStudy();
  STATE.studies.push(s);
  saveState();
  const tr = renderRow(s, STATE.studies.length - 1);
  document.getElementById("gridBody").appendChild(tr);
  updateCount();
  document.querySelector(".table-wrap").scrollLeft = 0;
  tr.querySelector("textarea").focus();
  tr.scrollIntoView({block:"nearest"});
}
function removeStudy(s){
  if(!isEmptyStudy(s) && !window.confirm(t("removeStudyConfirm"))) return;
  STATE.studies.splice(STATE.studies.indexOf(s), 1);
  if(!STATE.studies.length) STATE.studies.push(blankStudy());
  saveState();
  renderTableBody();
  updateCount(); refreshReview(); renderErrorList();
}
function renderTableBody(){
  const tbody = document.getElementById("gridBody");
  tbody.innerHTML = "";
  STATE.studies.forEach((s, i)=> tbody.appendChild(renderRow(s, i)));
  growAll(tbody);
  if(STATE.ui.reviewing) paintErrors(false);
}
function updateCount(){
  const c = document.getElementById("studyCount");
  if(c) c.textContent = countLabel(filledStudies().length);
}

function renderTopbar(){
  const bar = el("div",{class:"topbar"});
  bar.appendChild(el("img",{class:"logo-img", src:LOGO_WHITE_DATA_URI, alt:"RARE.Qc"}));
  bar.appendChild(el("div",{class:"bar-title"},[t("surveyTitle")]));
  bar.appendChild(el("div",{class:"spacer"}));
  bar.appendChild(el("div",{class:"save-state"},[ el("span",{class:"save-dot"}), el("span",{id:"saveLabel"},[t("autosaveOn")]) ]));
  const toggle = el("div",{class:"lang-toggle", role:"group", "aria-label":"Language / Langue"});
  ["en","fr"].forEach(lang=>{
    toggle.appendChild(el("button",{type:"button", class: STATE.ui.lang === lang ? "active" : "", "aria-pressed": String(STATE.ui.lang === lang),
      onclick: ()=>{ if(STATE.ui.lang === lang) return; STATE.ui.lang = lang; saveState(); renderApp(); }}, [lang.toUpperCase()]));
  });
  bar.appendChild(toggle);
  return bar;
}

function contactField(key, labelKey, type, autocomplete){
  const f = el("div",{class:"field", "data-field":key});
  const id = "f_contact_" + key;
  f.appendChild(el("label",{for:id},[t(labelKey), el("span",{class:"req", "aria-hidden":"true"},["*"])]));
  const input = el("input",{id:id, type:type, autocomplete:autocomplete, required:true});
  input.value = STATE.contact[key];
  input.addEventListener("input", e=>{ STATE.contact[key] = e.target.value; onEdit(); });
  input.addEventListener("blur", ()=>{ if(STATE.ui.reviewing || STATE.contact[key].trim()) paintCell(f, contactErrors()[key]); });
  f.appendChild(input);
  f.appendChild(errSlot());
  return f;
}

function renderApp(){
  document.documentElement.lang = isFr() ? "fr-CA" : "en-CA";
  document.title = "RARE.Qc | " + t("surveyTitle");
  const scrollY = window.scrollY;
  const prevScrollLeft = document.querySelector(".table-wrap") ? document.querySelector(".table-wrap").scrollLeft : 0;
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(renderTopbar());
  const shell = el("main",{class:"shell"});
  root.appendChild(shell);

  const hero = el("header",{class:"hero"});
  hero.appendChild(el("img",{class:"logo", src:LOGO_COLOUR_DATA_URI, alt:"RARE.Qc"}));
  hero.appendChild(el("h1",{},[t("surveyTitle")]));
  if(!STATE.ui.done){
    hero.appendChild(el("p",{html: t("introDirectory")}));   // fixed text with a link (no user input)
    hero.appendChild(el("p",{},[t("intro")]));
    hero.appendChild(el("div",{class:"save-line"},[el("span",{class:"dot"}), t("saveLine")]));
  }
  shell.appendChild(hero);

  if(STATE.ui.done){
    const n = STATE.ui.doneCount || 1;
    const done = el("section",{class:"done"});
    done.appendChild(el("div",{class:"tick"},["✓"]));
    done.appendChild(el("h2",{},[t("doneTitle")]));
    done.appendChild(el("p",{},[(n === 1 ? t("doneBody1") : t("doneBodyN").replace("{n}", n)) + " " + t("doneBody2")]));
    done.appendChild(el("button",{type:"button", class:"btn btn-primary", style:"margin-top:10px;", onclick: ()=>{
      STATE = freshState(STATE.ui.lang); saveState(); renderApp(); window.scrollTo(0,0);
    }},[t("anotherBtn")]));
    shell.appendChild(done);
    return;
  }

  // ---- table ----
  const hint = el("div",{class:"table-hint"});
  hint.appendChild(el("span",{},[t("oneRowPerStudy")]));
  hint.appendChild(el("span",{class:"count", id:"studyCount"},[countLabel(filledStudies().length)]));
  hint.appendChild(el("span",{class:"scroll-hint"},[t("scrollHint")]));
  shell.appendChild(hint);

  const wrap = el("div",{class:"table-wrap"});
  const table = el("table",{class:"grid"});
  table.appendChild(renderHead());
  table.appendChild(el("tbody",{id:"gridBody"}));
  wrap.appendChild(table);
  wrap.appendChild(el("button",{type:"button", class:"add-row-btn", onclick:addStudy},[t("addStudy")]));
  shell.appendChild(wrap);
  renderTableBody();
  const g = table.querySelector("thead tr.r1 th.group");
  if(g) table.style.setProperty("--head1-h", g.offsetHeight + "px");
  wrap.scrollLeft = prevScrollLeft;

  shell.appendChild(el("div",{id:"errorList"}));

  // ---- submitter contact: internal only ----
  const cb = el("div",{class:"contact-block"});
  const head = el("div",{class:"cb-head"},[t("contactTitle")]);
  head.appendChild(el("span",{class:"internal-tag"},[t("internalTag")]));
  cb.appendChild(head);
  const fields = el("div",{class:"fields"});
  fields.appendChild(contactField("name", "contactName", "text", "name"));
  fields.appendChild(contactField("email", "contactEmail", "email", "email"));
  cb.appendChild(fields);
  cb.appendChild(el("div",{class:"help"},[t("contactHelp")]));
  shell.appendChild(cb);

  // ---- actions ----
  const actions = el("div",{class:"actions"});
  actions.appendChild(el("div",{class:"note-save"},[el("span",{class:"dot"}), t("autosaveNote")]));
  actions.appendChild(el("button",{type:"button", class:"btn-text", onclick:clearAll},[t("clearBtn")]));
  actions.appendChild(el("button",{type:"button", class:"btn btn-primary", onclick:goToReview},[t("reviewBtn")]));
  shell.appendChild(actions);

  shell.appendChild(el("section",{class:"review" + (STATE.ui.reviewing ? "" : " hidden"), id:"review", "aria-live":"polite"}));
  if(STATE.ui.reviewing){ paintErrors(false); renderErrorList(); }
  refreshReview();
  window.scrollTo(0, scrollY);
}

function renderErrorList(){
  const box = document.getElementById("errorList");
  if(!box) return;
  box.innerHTML = "";
  const errs = allErrors();
  const ce = contactErrors();
  if(!errs.length && !Object.keys(ce).length) return;
  const colLabel = key => { const c = COLUMNS.find(c => c.key === key); return c ? t(c.label) : key; };
  const sep = isFr() ? " : " : ": ";
  const wrap = el("div",{class:"error-list", role:"alert"});
  wrap.appendChild(el("strong",{},[t("errorsTitle")]));
  const ul = el("ul",{});
  errs.forEach(r=>{
    const keys = Object.keys(r.errors);
    keys.forEach(k=>{
      // Both registry cells carry the same "add a link" error: list it once.
      if(k === "rsq" && r.errors.rsq === "registryRequired" && r.errors.ctgov === "registryRequired") return;
      const label = r.errors[k] === "registryRequired" ? t("colRegistry") : colLabel(k);
      ul.appendChild(el("li",{},[t("rowLabel") + " " + (r.index+1) + " — " + label + sep + t(r.errors[k])]));
    });
  });
  if(ce.name)  ul.appendChild(el("li",{},[t("contactName")  + sep + t(ce.name)]));
  if(ce.email) ul.appendChild(el("li",{},[t("contactEmail") + sep + t(ce.email)]));
  wrap.appendChild(ul);
  box.appendChild(wrap);
}

function refreshReview(){
  const box = document.getElementById("review");
  if(!box || !STATE.ui.reviewing) return;
  const rows = filledStudies();
  const ok = rows.length && !hasAnyError();
  box.innerHTML = "";
  box.appendChild(el("h2",{},[t("reviewTitle") + " — " + countLabel(rows.length)]));
  box.appendChild(el("p",{class:"muted"},[t("reviewDesc")]));
  const ol = el("ol",{});
  rows.forEach(s=>{
    const sites = s.sites.map(v => v.trim()).filter(Boolean).join(", ");
    ol.appendChild(el("li",{},[s.title.trim() || "—", el("span",{class:"meta"},[sites ? "  ·  " + sites : ""])]));
  });
  box.appendChild(ol);
  const actions = el("div",{class:"actions"});
  actions.appendChild(el("button",{type:"button", class:"btn btn-secondary", onclick:()=>{
    document.querySelector(".table-wrap").scrollIntoView({behavior:"smooth", block:"start"});
  }},[t("editBtn")]));
  actions.appendChild(el("button",{type:"button", class:"btn btn-primary", id:"submitBtn", disabled: !ok, onclick:submitSurvey},[t("submitBtn")]));
  box.appendChild(actions);
}

function goToReview(){
  STATE.studies.forEach(s=>{
    s.ctgov = normalizeCtgov(s.ctgov);
    s.rsq = normalizeUrl(s.rsq);
  });
  STATE.contact.email = STATE.contact.email.trim();
  STATE.ui.reviewing = true;
  saveState();
  renderApp();
  const box = document.getElementById("review");
  if(!filledStudies().length){
    box.classList.add("hidden");
    toast(t("noStudies"));
    const first = document.querySelector("#gridBody textarea"); if(first) first.focus();
    return;
  }
  if(hasAnyError()){
    box.classList.add("hidden");
    toast(t("toastFillRequired"));
    const firstBad = document.querySelector("#gridBody td.invalid, .contact-block .field.invalid");
    if(firstBad){
      firstBad.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
      const f = firstBad.querySelector("textarea, input"); if(f) setTimeout(()=> f.focus({preventScroll:true}), 350);
    }
    return;
  }
  box.classList.remove("hidden");
  refreshReview();
  box.scrollIntoView({behavior:"smooth", block:"center"});
}

/* ================== PART E — SUBMIT ================================= */
function fmtDate(d){ return d.toISOString().slice(0,10); }
function fmtDateTime(d){
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function safeFileToken(s){ return (s || "study").toString().trim().replace(/[^a-z0-9]+/gi, "_").slice(0,40) || "study"; }

// Public record: what may be shown in the directory.
function buildPublicRecord(s){
  return {
    studyTitle: s.title.trim(),
    clinicalTrialsGovUrl: s.ctgov.trim(),
    rsqUrl: s.rsq.trim(),
    quebecSites: s.sites.map(v => v.trim()).filter(Boolean)
  };
}
// Internal record: never for public display.
function buildInternalRecord(){ return { submitterName: STATE.contact.name.trim(), submitterEmail: STATE.contact.email.trim() }; }

const PUBLIC_HEADERS = ["Study title","ClinicalTrials.gov link","Recherche Santé Québec link","Sites in Quebec"];
function publicRow(p){ return [p.studyTitle, p.clinicalTrialsGovUrl, p.rsqUrl, p.quebecSites.join("; ")]; }

function buildWorkbook(records, internal, meta){
  const wb = XLSX.utils.book_new();
  const pub = [["#"].concat(PUBLIC_HEADERS)];
  records.forEach((r, i)=> pub.push([i+1].concat(publicRow(r))));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pub), "Studies (public)");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Field","Value"],
    ["Submitter name — INTERNAL ONLY, DO NOT PUBLISH", internal.submitterName],
    ["Submitter email — INTERNAL ONLY, DO NOT PUBLISH", internal.submitterEmail],
    ["Applies to studies", records.map(r => r.studyTitle).join("; ")],
    ["Form language", meta.formLanguage],
    ["Submission date", meta.submissionDate]]), "Internal (not public)");
  return wb;
}

async function submitSurvey(){
  const rows = filledStudies();
  if(!rows.length || hasAnyError()){ goToReview(); return; }
  if(typeof XLSX === "undefined"){ toast(t("toastNoLibrary")); return; }

  const btn = document.getElementById("submitBtn");
  if(btn){ btn.disabled = true; btn.textContent = t("submitting"); }

  try{
    const now = new Date();
    const meta = { submissionDate: fmtDateTime(now), formLanguage: STATE.ui.lang };
    const records = rows.map(buildPublicRecord);
    const internal = buildInternalRecord();
    const first = records[0].studyTitle;
    const displayName = records.length === 1 ? first : first + " (+" + (records.length - 1) + " more)";
    const fileName = "RAREQc_RepertoriedStudies_" + safeFileToken(first) + "_" + fmtDate(now) + ".xlsx";
    const fileBase64 = XLSX.write(buildWorkbook(records, internal, meta), { bookType:"xlsx", type:"base64" });

    // Same top-level keys the existing email function already reads (as in the
    // other RARE.Qc surveys), plus the structured `studies` and `internal` data.
    const payload = {
      surveyType: SURVEY_TYPE,
      labName: displayName,
      pi: "",
      contactPerson: internal.submitterName + " <" + internal.submitterEmail + ">",
      resourceCount: records.length,
      submissionDate: meta.submissionDate,
      fileName: fileName,
      fileBase64: fileBase64,
      sheetRows: [],                       // never appended to the resource inventory Sheet
      formLanguage: meta.formLanguage,
      studies: records,
      internal: internal
    };

    // 1) Google Sheet first. If this fails, nothing is emailed and the respondent
    //    can try again without creating duplicate rows.
    if(SHEETS_ENDPOINT){
      const sheetPayload = Object.assign({}, payload); delete sheetPayload.fileBase64;
      const r = await fetch(SHEETS_ENDPOINT, {
        method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(sheetPayload)
      });
      if(!r.ok) throw new Error("Sheet endpoint responded with status " + r.status);
    }
    // 2) Email with the Excel attachment.
    try{
      const response = await fetch(SUBMISSION_ENDPOINT, {
        method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload)
      });
      if(!response.ok) throw new Error("Server responded with status " + response.status);
    }catch(mailErr){
      // Already in the Google Sheet: don't ask the respondent to resubmit (it would duplicate rows).
      if(SHEETS_ENDPOINT) console.warn("Saved to the Google Sheet, but the email step failed:", mailErr);
      else throw mailErr;
    }

    const lang = STATE.ui.lang;
    STATE = freshState(lang);
    STATE.ui.done = true; STATE.ui.doneCount = records.length;
    saveState();
    renderApp();
    window.scrollTo(0,0);
    toast(t("toastSubmitSuccess"));
  }catch(err){
    console.error("Submission failed:", err);
    toast(t("toastSubmitFail"));
    if(btn){ btn.disabled = false; btn.textContent = t("submitBtn"); }
  }
}

/* ================== PART F — BOOTSTRAP ============================== */
function init(){
  const hadSaved = loadState();
  renderApp();
  if(hadSaved && !STATE.ui.done) toast(t("toastResumed"));
  setInterval(saveState, 15000);
  window.addEventListener("pagehide", saveState);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") saveState(); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=> growAll());
}
document.addEventListener("DOMContentLoaded", init);
</script>
